<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | YatraSathi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
                url("{{ url_for('static', filename='images/hampi_bg.jpg') }}");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 420px;
            background: rgba(255, 255, 255, 0.96);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo i {
            color: #f59e0b;
            font-size: 42px;
        }

        .logo h2 {
            margin-top: 10px;
            font-weight: bold;
            color: #222;
        }

        .logo p {
            color: #777;
            margin-bottom: 0;
        }

        .form-label {
            font-weight: 600;
        }

        .input-group-text {
            background: white;
        }

        .form-control {
            padding: 12px;
        }

        .form-control:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 0.2rem rgba(245, 158, 11, 0.15);
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 45px;
        }

        .eye-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);

            border: none;
            background: transparent;
            color: #777;
            cursor: pointer;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;

            background: #f59e0b;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        .register-btn:hover {
            background: #d97706;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #f59e0b;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee2e2;
            color: #b91c1c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="register-card">

    <!-- Logo -->
    <div class="logo">

        <i class="fa-solid fa-route"></i>

        <h2>Join YatraSathi</h2>

        <p>Create your travel account</p>

    </div>


    <!-- Error Message -->
    {% if error %}
    <div class="error-message">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ error }}
    </div>
    {% endif %}


    <!-- Registration Form -->
    <form method="POST"
          action="{{ url_for('register') }}"
          onsubmit="return validateForm()">

        <!-- Name -->
        <div class="mb-3">

            <label class="form-label">
                <i class="fa-solid fa-user"></i>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                id="name"
                class="form-control"
                placeholder="Enter your full name"
                required
            >

        </div>


        <!-- Email -->
        <div class="mb-3">

            <label class="form-label">
                <i class="fa-solid fa-envelope"></i>
                Email Address
            </label>

            <input
                type="email"
                name="email"
                id="email"
                class="form-control"
                placeholder="Enter your email"
                required
            >

        </div>


        <!-- Password -->
        <div class="mb-3">

            <label class="form-label">
                <i class="fa-solid fa-lock"></i>
                Password
            </label>

            <div class="password-wrap">

                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    placeholder="Create a password"
                    minlength="4"
                    required
                >

                <button
                    type="button"
                    class="eye-btn"
                    onclick="togglePassword('password', 'eyeIcon1')">

                    <i id="eyeIcon1"
                       class="fa-solid fa-eye"></i>

                </button>

            </div>

        </div>


        <!-- Confirm Password -->
        <div class="mb-4">

            <label class="form-label">
                <i class="fa-solid fa-lock"></i>
                Confirm Password
            </label>

            <div class="password-wrap">

                <input
                    type="password"
                    id="confirm_password"
                    class="form-control"
                    placeholder="Confirm your password"
                    minlength="4"
                    required
                >

                <button
                    type="button"
                    class="eye-btn"
                    onclick="togglePassword('confirm_password', 'eyeIcon2')">

                    <i id="eyeIcon2"
                       class="fa-solid fa-eye"></i>

                </button>

            </div>

        </div>


        <!-- Register -->
        <button type="submit" class="register-btn">

            <i class="fa-solid fa-user-plus"></i>
            Create Account

        </button>

    </form>


    <!-- Login -->
    <div class="login-link">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </div>

</div>


<script>

function togglePassword(inputId, iconId) {

    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);

    if (input.type === "password") {

        input.type = "text";

        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");

    } else {

        input.type = "password";

        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");

    }
}


function validateForm() {

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirm_password").value;


    if (password !== confirmPassword) {

        alert("Passwords do not match.");

        return false;
    }

    return true;
}

</script>

</body>
</html>
