<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | YatraSathi</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #fff8f2;
            color: #333;
        }

        /* NAVBAR */

        .navbar {
            background: white;
            padding: 15px 7%;
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
        }

        .brand {
            color: #f47b20;
            text-decoration: none;
            font-size: 25px;
            font-weight: 800;
        }

        .nav-link {
            color: #333 !important;
            font-weight: 600;
            margin-left: 20px;
        }

        .nav-link:hover {
            color: #f47b20 !important;
        }

        /* PAGE */

        .profile-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .page-title h1 {
            font-size: 40px;
            font-weight: 800;
        }

        .page-title span {
            color: #f47b20;
        }

        .page-title p {
            color: #777;
            margin-top: 8px;
        }

        /* PROFILE CARD */

        .profile-card {
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
            border: 1px solid #f0e2d8;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 25px;
            padding-bottom: 30px;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
        }

        .profile-icon {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: #fff0e4;
            color: #f47b20;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .profile-header h2 {
            font-size: 27px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .profile-header p {
            color: #888;
            margin: 0;
        }

        /* FORM */

        .form-label {
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-control,
        .form-select {
            min-height: 50px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #f47b20;
            box-shadow: 0 0 0 3px rgba(244,123,32,.12);
        }

        /* INTERESTS */

        .interest-box {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .interest {
            background: #fff3e8;
            color: #d9600e;
            padding: 9px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        /* BUTTON */

        .save-btn {
            background: #f47b20;
            color: white;
            border: none;
            padding: 13px 28px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            transition: .25s;
        }

        .save-btn:hover {
            background: #d9600e;
            transform: translateY(-2px);
        }

        .back-btn {
            text-decoration: none;
            color: #555;
            font-weight: 600;
            margin-left: 12px;
        }

        .back-btn:hover {
            color: #f47b20;
        }

        /* FOOTER */

        footer {
            margin-top: 60px;
            background: #292522;
            color: white;
            text-align: center;
            padding: 30px;
        }

        footer .logo {
            color: #f47b20;
            font-size: 23px;
            font-weight: 800;
        }

        footer p {
            color: #bbb;
            margin: 5px 0 0;
        }

        @media(max-width: 600px) {

            .profile-container {
                margin-top: 30px;
            }

            .profile-card {
                padding: 25px;
            }

            .profile-header {
                flex-direction: column;
                text-align: center;
            }

            .page-title h1 {
                font-size: 32px;
            }

            .nav-link {
                margin-left: 0;
            }

        }

    </style>

</head>

<body>


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg">

    <div class="container-fluid">

        <a
            href="{{ url_for('home') }}"
            class="brand">

            🧭 YatraSathi

        </a>

        <div class="ms-auto d-flex flex-wrap gap-3">

            <a
                href="{{ url_for('home') }}"
                class="nav-link">

                Home

            </a>

            <a
                href="{{ url_for('explore') }}"
                class="nav-link">

                Explore

            </a>

            <a
                href="{{ url_for('dashboard') }}"
                class="nav-link">

                Dashboard

            </a>

        </div>

    </div>

</nav>


<!-- PAGE -->

<main class="profile-container">


    <div class="page-title">

        <h1>
            My <span>Profile</span>
        </h1>

        <p>
            Manage your YatraSathi traveller information
        </p>

    </div>


    <div class="profile-card">


        <!-- PROFILE HEADER -->

        <div class="profile-header">

            <div class="profile-icon">

                <i class="fa-solid fa-user"></i>

            </div>

            <div>

                <h2 id="profileName">
                    Traveller
                </h2>

                <p>
                    YatraSathi Traveller
                </p>

            </div>

        </div>


        <!-- FORM -->

        <form id="profileForm">


            <div class="row g-4">


                <!-- NAME -->

                <div class="col-md-6">

                    <label class="form-label">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter your name"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="col-md-6">

                    <label class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                </div>


                <!-- PHONE -->

                <div class="col-md-6">

                    <label class="form-label">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        class="form-control"
                        placeholder="Enter phone number">

                </div>


                <!-- LOCATION -->

                <div class="col-md-6">

                    <label class="form-label">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        class="form-control"
                        placeholder="Enter your city">

                </div>


                <!-- TRAVEL STYLE -->

                <div class="col-md-6">

                    <label class="form-label">
                        Preferred Travel Style
                    </label>

                    <select
                        id="travelStyle"
                        class="form-select">

                        <option value="Budget">
                            💰 Budget
                        </option>

                        <option value="Comfort">
                            🏨 Comfort
                        </option>

                        <option value="Luxury">
                            ✨ Luxury
                        </option>

                    </select>

                </div>


                <!-- LANGUAGE -->

                <div class="col-md-6">

                    <label class="form-label">
                        Preferred Language
                    </label>

                    <select
                        id="language"
                        class="form-select">

                        <option value="English">
                            English
                        </option>

                        <option value="Kannada">
                            ಕನ್ನಡ
                        </option>

                        <option value="Hindi">
                            हिन्दी
                        </option>

                    </select>

                </div>


                <!-- INTERESTS -->

                <div class="col-12">

                    <label class="form-label">
                        ❤️ Travel Interests
                    </label>

                    <div class="interest-box">

                        <span class="interest">
                            🏛️ Heritage
                        </span>

                        <span class="interest">
                            🌿 Nature
                        </span>

                        <span class="interest">
                            🏕️ Adventure
                        </span>

                        <span class="interest">
                            🍛 Food
                        </span>

                        <span class="interest">
                            🏖️ Beach
                        </span>

                        <span class="interest">
                            🧘 Relaxation
                        </span>

                    </div>

                </div>


                <!-- BUTTONS -->

                <div class="col-12 mt-4">

                    <button
                        type="submit"
                        class="save-btn">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Save Profile

                    </button>


                    <a
                        href="{{ url_for('dashboard') }}"
                        class="back-btn">

                        Back to Dashboard

                    </a>

                </div>

            </div>

        </form>

    </div>

</main>


<!-- FOOTER -->

<footer>

    <div class="logo">
        🧭 YatraSathi
    </div>

    <p>
        Explore Karnataka Like Never Before
    </p>

</footer>


<script>

document
.getElementById("profileForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value;

    document.getElementById("profileName").textContent =
        name || "Traveller";

    localStorage.setItem(
        "yatraName",
        name
    );

    localStorage.setItem(
        "yatraEmail",
        document.getElementById("email").value
    );

    localStorage.setItem(
        "yatraPhone",
        document.getElementById("phone").value
    );

    localStorage.setItem(
        "yatraCity",
        document.getElementById("city").value
    );

    localStorage.setItem(
        "yatraTravelStyle",
        document.getElementById("travelStyle").value
    );

    localStorage.setItem(
        "yatraLanguage",
        document.getElementById("language").value
    );

    alert("Profile saved successfully! ✨");

});


/* LOAD SAVED PROFILE */

window.addEventListener("load", function() {

    const name =
        localStorage.getItem("yatraName");

    const email =
        localStorage.getItem("yatraEmail");

    const phone =
        localStorage.getItem("yatraPhone");

    const city =
        localStorage.getItem("yatraCity");

    const travelStyle =
        localStorage.getItem("yatraTravelStyle");

    const language =
        localStorage.getItem("yatraLanguage");


    if (name) {

        document.getElementById("name").value =
            name;

        document.getElementById("profileName").textContent =
            name;

    }

    if (email)
        document.getElementById("email").value = email;

    if (phone)
        document.getElementById("phone").value = phone;

    if (city)
        document.getElementById("city").value = city;

    if (travelStyle)
        document.getElementById("travelStyle").value =
            travelStyle;

    if (language)
        document.getElementById("language").value =
            language;

});

</script>


</body>
</html>
