<!-- ==========================================
     YATRASATHI CHATBOT
=========================================== -->

<style>
    #ys-chat-button {
        position: fixed;
        right: 25px;
        bottom: 25px;
        width: 65px;
        height: 65px;
        border: none;
        border-radius: 50%;
        background: #ff8c00;
        color: white;
        font-size: 28px;
        cursor: pointer;
        z-index: 999999;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.25);
    }

    #ys-chat-button:hover {
        background: #e67e00;
    }

    #ys-chat-window {
        position: fixed;
        right: 25px;
        bottom: 105px;
        width: 380px;
        height: 520px;
        background: white;
        border-radius: 18px;
        box-shadow: 0 8px 35px rgba(0, 0, 0, 0.25);
        z-index: 999999;
        display: none;
        flex-direction: column;
        overflow: hidden;
    }

    #ys-chat-window.ys-open {
        display: flex !important;
    }

    .ys-chat-header {
        background: #ff8c00;
        color: white;
        padding: 15px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .ys-chat-header h5 {
        margin: 0;
        font-size: 18px;
    }

    .ys-chat-header small {
        display: block;
        margin-top: 3px;
    }

    #ys-close-chat {
        border: none;
        background: transparent;
        color: white;
        font-size: 28px;
        cursor: pointer;
    }

    #ys-chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
        background: #fff8f0;
    }

    .ys-message {
        max-width: 82%;
        padding: 10px 13px;
        margin-bottom: 10px;
        border-radius: 14px;
        line-height: 1.5;
        font-size: 14px;
        white-space: pre-wrap;
    }

    .ys-bot {
        background: white;
        border: 1px solid #eee;
        color: #333;
    }

    .ys-user {
        margin-left: auto;
        background: #ff8c00;
        color: white;
    }

    .ys-quick-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0 15px 0;
    }

    .ys-quick-btn {
        border: 1px solid #ff8c00;
        background: white;
        color: #e67e00;
        border-radius: 20px;
        padding: 7px 12px;
        font-size: 12px;
        cursor: pointer;
        transition: 0.2s;
    }

    .ys-quick-btn:hover {
        background: #ff8c00;
        color: white;
        transform: translateY(-1px);
    }

    .ys-chat-input {
        display: flex;
        gap: 8px;
        padding: 12px;
        background: white;
        border-top: 1px solid #eee;
    }

    #ys-message-input {
        flex: 1;
        min-width: 0;
        border: 1px solid #ddd;
        border-radius: 22px;
        padding: 10px 15px;
        outline: none;
    }

    #ys-message-input:focus {
        border-color: #ff8c00;
    }

    #ys-send-button,
    #ys-voice-button {
        width: 43px;
        height: 43px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
        flex-shrink: 0;
    }

    #ys-send-button {
        border: none;
        background: #ff8c00;
        color: white;
    }

    #ys-voice-button {
        background: white;
        border: 2px solid #ff8c00;
        color: #ff8c00;
    }

    #ys-voice-button:hover {
        background: #fff3e6;
    }

    #ys-voice-button.listening {
        background: #ff8c00;
        color: white;
        animation: ys-pulse 1s infinite;
    }

    @keyframes ys-pulse {
        0% {
            box-shadow: 0 0 0 0 rgba(255, 140, 0, 0.6);
        }

        70% {
            box-shadow: 0 0 0 10px rgba(255, 140, 0, 0);
        }

        100% {
            box-shadow: 0 0 0 0 rgba(255, 140, 0, 0);
        }
    }

    .ys-map-button {
        display: block;
        width: fit-content;
        margin-top: 10px;
        padding: 8px 13px;
        background: #ff8c00;
        color: white;
        text-decoration: none;
        border-radius: 18px;
        font-size: 13px;
        font-weight: 600;
        transition: 0.2s;
    }

    .ys-map-button:hover {
        background: #e67e00;
        color: white;
        transform: translateY(-1px);
    }

    .ys-speak-button {
        display: block;
        margin-top: 8px;
        padding: 6px 10px;
        border: 1px solid #ff8c00;
        border-radius: 16px;
        background: white;
        color: #e67e00;
        cursor: pointer;
        font-size: 12px;
    }

    .ys-speak-button:hover {
        background: #fff3e6;
    }

    @media (max-width: 500px) {
        #ys-chat-window {
            right: 10px;
            bottom: 90px;
            width: calc(100% - 20px);
            height: 70vh;
        }

        #ys-chat-button {
            right: 15px;
            bottom: 15px;
        }
    }
</style>


<!-- FLOATING CHAT BUTTON -->
<button
    type="button"
    id="ys-chat-button"
    aria-label="Open YatraSathi chatbot"
>
    💬
</button>


<!-- CHAT WINDOW -->
<div id="ys-chat-window">

    <div class="ys-chat-header">
        <div>
            <h5>🤖 YatraSathi AI</h5>
            <small>Karnataka Travel Assistant</small>
        </div>

        <button
            type="button"
            id="ys-close-chat"
            aria-label="Close chatbot"
        >
            ×
        </button>
    </div>


    <div id="ys-chat-messages">

        <div class="ys-message ys-bot">
            👋 Namaste! I'm YatraSathi AI.

            Ask me anything about Karnataka tourism.
        </div>


        <div class="ys-quick-actions">

            <button
                type="button"
                class="ys-quick-btn"
                data-message="Suggest the best tourist places in Karnataka"
            >
                📍 Places
            </button>

            <button
                type="button"
                class="ys-quick-btn"
                data-message="Help me plan a Karnataka trip"
            >
                🗓️ Plan Trip
            </button>

            <button
                type="button"
                class="ys-quick-btn"
                data-message="Help me calculate a Karnataka trip budget"
            >
                💰 Budget
            </button>

            <button
                type="button"
                class="ys-quick-btn"
                data-message="Suggest hotels for my Karnataka trip"
            >
                🏨 Hotels
            </button>

            <button
                type="button"
                class="ys-quick-btn"
                data-message="Suggest restaurants and local food in Karnataka"
            >
                🍽️ Food
            </button>

            <button
                type="button"
                class="ys-quick-btn"
                data-message="Show Hampi on map"
            >
                🗺️ Map
            </button>

            <button
                type="button"
                class="ys-quick-btn"
                data-message="What is the weather in Hampi?"
            >
                🌦️ Weather
            </button>

        </div>

    </div>


    <div class="ys-chat-input">

        <input
            type="text"
            id="ys-message-input"
            placeholder="Ask about Karnataka..."
            autocomplete="off"
        >

        <button
            type="button"
            id="ys-voice-button"
            title="Speak"
            aria-label="Voice input"
        >
            🎤
        </button>

        <button
            type="button"
            id="ys-send-button"
            aria-label="Send message"
        >
            ➤
        </button>

    </div>

</div>


<script>
(function () {
    "use strict";

    console.log("YatraSathi chatbot script loaded");

    const openButton =
        document.getElementById("ys-chat-button");

    const chatWindow =
        document.getElementById("ys-chat-window");

    const closeButton =
        document.getElementById("ys-close-chat");

    const input =
        document.getElementById("ys-message-input");

    const sendButton =
        document.getElementById("ys-send-button");

    const voiceButton =
        document.getElementById("ys-voice-button");

    const messages =
        document.getElementById("ys-chat-messages");


    if (
        !openButton ||
        !chatWindow ||
        !closeButton ||
        !input ||
        !sendButton ||
        !voiceButton ||
        !messages
    ) {
        console.error("YatraSathi chatbot elements are missing.");
        return;
    }


    /* ==========================================
       OPEN / CLOSE CHAT
    ========================================== */

    openButton.addEventListener("click", function () {
        chatWindow.classList.add("ys-open");
        input.focus();
    });


    closeButton.addEventListener("click", function () {
        stopYatraSathiVoice();
        chatWindow.classList.remove("ys-open");
    });


    /* ==========================================
       TEXT TO SPEECH
    ========================================== */

    function speakText(text) {

    if (!("speechSynthesis" in window)) {
        alert("Voice output is not supported in this browser.");
        return;
    }

    // Stop any previous voice immediately
    window.speechSynthesis.cancel();

    const languageSelector =
        document.getElementById("languageSelector");

    let selectedLanguage = "en";

    if (languageSelector) {
        selectedLanguage = languageSelector.value;
    }

    const speech =
        new SpeechSynthesisUtterance(text);

    // Set correct language
    if (selectedLanguage === "kn") {
        speech.lang = "kn-IN";
    }
    else if (selectedLanguage === "hi") {
        speech.lang = "hi-IN";
    }
    else {
        speech.lang = "en-IN";
    }

    // Find available voices
    const voices =
        window.speechSynthesis.getVoices();

    const languageVoices =
        voices.filter(function (voice) {

            return voice.lang
                .toLowerCase()
                .startsWith(
                    speech.lang
                        .substring(0, 2)
                        .toLowerCase()
                );
        });

    if (languageVoices.length > 0) {
        speech.voice = languageVoices[0];
    }

    // Faster natural speech
    speech.rate = 1.08;
    speech.pitch = 1.05;
    speech.volume = 1;

    window.speechSynthesis.speak(speech);
}


// ==========================================
// STOP VOICE WHEN LEAVING PAGE
// ==========================================

function stopYatraSathiVoice() {

    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
    }
}


// Back button / another page
window.addEventListener(
    "pagehide",
    stopYatraSathiVoice
);


// Refresh / close tab / navigate
window.addEventListener(
    "beforeunload",
    stopYatraSathiVoice
);


// Browser back/forward
window.addEventListener(
    "popstate",
    stopYatraSathiVoice
);


// When page becomes hidden
document.addEventListener(
    "visibilitychange",
    function () {

        if (document.hidden) {
            stopYatraSathiVoice();
        }

    }
);

    /* ==========================================
       ADD MESSAGE
    ========================================== */

    function addMessage(
        text,
        sender,
        mapUrl = null,
        placeName = null
    ) {
        const div =
            document.createElement("div");

        div.classList.add("ys-message");

        if (sender === "user") {

            div.classList.add("ys-user");
            div.textContent = text;

        } else {

            div.classList.add("ys-bot");

            const textDiv =
                document.createElement("div");

            textDiv.textContent = text;

            div.appendChild(textDiv);

            if (mapUrl) {

                const mapButton =
                    document.createElement("a");

                mapButton.href = mapUrl;
                mapButton.target = "_blank";
                mapButton.rel = "noopener noreferrer";
                mapButton.className = "ys-map-button";

                mapButton.textContent =
                    placeName
                        ? `📍 Open ${placeName} in Google Maps`
                        : "📍 Open Google Maps";

                div.appendChild(mapButton);
            }

            const speakButton =
                document.createElement("button");

            speakButton.type = "button";
            speakButton.className = "ys-speak-button";
            speakButton.textContent = "🔊 Listen";

            speakButton.addEventListener(
                "click",
                function () {
                    speakText(text);
                }
            );

            div.appendChild(speakButton);
        }

        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
    }


    /* ==========================================
       SEND MESSAGE
    ========================================== */

    async function sendMessage() {

        const text = input.value.trim();

        if (!text) {
            return;
        }

        addMessage(text, "user");

        input.value = "";
        sendButton.disabled = true;
        voiceButton.disabled = true;

        const thinking =
            document.createElement("div");

        thinking.className =
            "ys-message ys-bot";

        thinking.textContent =
            "YatraSathi AI is thinking...";

        messages.appendChild(thinking);
        messages.scrollTop = messages.scrollHeight;

        const controller =
            new AbortController();

        const timeout =
            setTimeout(
                function () {
                    controller.abort();
                },
                60000
            );

        try {

            let language = "en";

            const languageSelector =
                document.getElementById(
                    "languageSelector"
                );

            if (languageSelector) {
                language =
                    languageSelector.value || "en";
            }

            const response =
                await fetch(
                    "/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                message: text,
                                language: language
                            }),

                        signal:
                            controller.signal
                    }
                );

            let data = {};

            try {
                data = await response.json();
            } catch (jsonError) {
                throw new Error(
                    "The server returned an invalid response."
                );
            }

            if (thinking.isConnected) {
                thinking.remove();
            }

            if (data.reply) {

                addMessage(
                    data.reply,
                    "bot",
                    data.map_url || null,
                    data.place_name || null
                );

            } else {

                addMessage(
                    "Sorry, I could not generate a response.",
                    "bot"
                );
            }

        } catch (error) {

            if (thinking.isConnected) {
                thinking.remove();
            }

            console.error(
                "Chatbot request error:",
                error
            );

            if (error.name === "AbortError") {

                addMessage(
                    "The request took too long. Please try again.",
                    "bot"
                );

            } else {

                addMessage(
                    "Unable to connect to YatraSathi AI.",
                    "bot"
                );
            }

        } finally {

            clearTimeout(timeout);

            sendButton.disabled = false;
            voiceButton.disabled = false;
            input.focus();
        }
    }


    /* ==========================================
       QUICK ACTIONS
    ========================================== */

    const quickButtons =
        document.querySelectorAll(
            ".ys-quick-btn"
        );

    quickButtons.forEach(
        function (button) {

            button.addEventListener(
                "click",
                function () {

                    const message =
                        button.getAttribute(
                            "data-message"
                        );

                    if (!message) {
                        return;
                    }

                    input.value = message;
                    sendMessage();
                }
            );
        }
    );


    /* ==========================================
       SEND BUTTON + ENTER
    ========================================== */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    input.addEventListener(
        "keydown",
        function (event) {

            if (event.key === "Enter") {

                event.preventDefault();
                sendMessage();
            }
        }
    );


    /* ==========================================
       VOICE INPUT
    ========================================== */

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (SpeechRecognition) {

        const recognition =
            new SpeechRecognition();

        recognition.continuous = false;
        recognition.interimResults = false;


        voiceButton.addEventListener(
            "click",
            function () {

                let selectedLanguage = "en";

                const languageSelector =
                    document.getElementById(
                        "languageSelector"
                    );

                if (languageSelector) {
                    selectedLanguage =
                        languageSelector.value;
                }

                if (selectedLanguage === "kn") {

                    recognition.lang = "kn-IN";

                } else if (
                    selectedLanguage === "hi"
                ) {

                    recognition.lang = "hi-IN";

                } else {

                    recognition.lang = "en-IN";
                }

                try {

                    recognition.start();

                    voiceButton.classList.add(
                        "listening"
                    );

                    voiceButton.textContent = "🔴";
                    input.placeholder = "Listening...";

                } catch (error) {

                    console.log(
                        "Voice recognition already running."
                    );
                }
            }
        );


        recognition.onresult = function (event) {

    const transcript =
        event.results[0][0].transcript.trim();

    console.log(
        "Voice recognized:",
        transcript
    );

    const command =
        transcript.toLowerCase();


    // ==========================================
    // PLAN TRIP COMMAND
    // ==========================================

    const planCommands = [
        "plan my trip",
        "plan trip",
        "trip planner",
        "plan a trip",
        "plan my journey",
        "create my trip",
        "create trip",
        "open planner"
    ];


    const isPlanCommand =
        planCommands.some(function (item) {

            return command.includes(item);

        });


    if (isPlanCommand) {

        // Stop voice before changing page
        if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
        }

        recognition.stop();

        input.value = "";

        // Open actual YatraSathi Planner
        window.location.href =
            "{{ url_for('planner') }}";

        return;
    }


    // ==========================================
    // WEATHER COMMAND
    // ==========================================

    if (
        command.includes("weather") ||
        command.includes("live weather")
    ) {

        recognition.stop();

        window.location.href =
            "{{ url_for('weather_page') }}";

        return;
    }


    // ==========================================
    // LOCATION COMMAND
    // ==========================================

    if (
        command.includes("near me") ||
        command.includes("my location") ||
        command.includes("current location")
    ) {

        recognition.stop();

        window.location.href =
            "{{ url_for('near_me') }}";

        return;
    }


    // ==========================================
    // EXPLORE COMMAND
    // ==========================================

    if (
        command.includes("explore") ||
        command.includes("show places") ||
        command.includes("tourist places")
    ) {

        recognition.stop();

        window.location.href =
            "{{ url_for('explore') }}";

        return;
    }


    // ==========================================
    // NORMAL AI QUESTION
    // ==========================================

    input.value = transcript;

    setTimeout(
        function () {
            sendMessage();
        },
        150
    );
};


        recognition.onend =
            function () {

                voiceButton.classList.remove(
                    "listening"
                );

                voiceButton.textContent = "🎤";
                input.placeholder =
                    "Ask about Karnataka...";
            };


        recognition.onerror =
            function (event) {

                console.error(
                    "Speech recognition error:",
                    event.error
                );

                voiceButton.classList.remove(
                    "listening"
                );

                voiceButton.textContent = "🎤";
                input.placeholder =
                    "Ask about Karnataka...";

                if (event.error === "not-allowed") {

                    alert(
                        "Please allow microphone permission in your browser."
                    );

                } else if (
                    event.error === "no-speech"
                ) {

                    alert(
                        "No speech detected. Please try again."
                    );

                } else {

                    alert(
                        "Voice recognition error. Please try again."
                    );
                }
            };

    } else {

        voiceButton.addEventListener(
            "click",
            function () {

                alert(
                    "Voice input is not supported in this browser. " +
                    "Please use Google Chrome or Microsoft Edge."
                );
            }
        );
    }

})();
</script>
